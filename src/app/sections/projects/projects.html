<section id="projects">
    <h2 id="projects-title">PROYECTOS</h2>

    <div id="projects-container">
        @for (project of projects(); track project.id; let i = $index) {
            <div class="project-card" [id]="'project-' + project.id">
                <!-- <div class="project-cover">
                    <img class="project-cover-image" [src]="project.images[0]" [alt]="project.name + ' image'" />
                </div> -->
                <div class="project-info">
                    <h3>{{project.name}}</h3> 
                    <p>{{project.description}}</p>
                    <div class="project-images">
                        @for (image of project.images; track image) {
                            <img class="project-images-images" [src]="image" [alt]="project.name + ' image'" />
                        }
                    </div>
                    <h4>Tecnologías</h4>
                    <mat-chip-set class="skills-list">
                        @for (skill of project.skills; track skill) {
                            <mat-chip>{{skill}}</mat-chip>
                        }
                    </mat-chip-set>
                    @if (project.link) {
                        <a href={{project.link}} target="_blank" rel="noopener noreferrer">Ver proyecto →</a>
                    }
                </div>

            </div>
        }
    </div>
</section>
